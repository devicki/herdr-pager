# A self-hosted ntfy for herdr-pager. Bound to localhost; expose it with a reverse proxy or,
# on a tailnet, `tailscale serve --bg --https=8446 http://127.0.0.1:2586`.
services:
  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    command: serve
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul            # your time zone, for log timestamps
    ports:
      - "127.0.0.1:2586:80"
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ./data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
